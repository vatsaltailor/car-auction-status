<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Testing pipeline — status</title>
<style>
  :root{--paper:#F6F8FA;--card:#FFF;--ink:#14202B;--soft:#4A5B69;--steel:#2E6E8E;--rule:#D8E0E7;--dim:#9BAAB6;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    --done:#16A34A;--run:#2563EB;--queue:#C6CDD4;}
  *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px}
  .head{background:var(--card);border-bottom:1px solid var(--rule);padding:14px 20px}
  .head h1{font-family:var(--sans);font-weight:600;font-size:18px;margin:0}
  .legend{font-family:var(--mono);font-size:11.5px;color:var(--soft);margin-top:8px;display:flex;gap:16px;flex-wrap:wrap}
  .legend span{display:flex;align-items:center;gap:6px}
  .legend i{width:9px;height:9px;border-radius:50%;display:block}
  .wrap{padding:16px 20px 60px;max-width:820px}
  .bar{display:flex;gap:8px;margin-bottom:10px}
  .bar button{font-family:var(--mono);font-size:12px;border:1px solid var(--rule);background:var(--card);color:var(--steel);border-radius:4px;padding:4px 9px;cursor:pointer}
  .node .kids{margin-left:12px;padding-left:12px;border-left:1.5px solid var(--rule)}
  .row{display:flex;align-items:center;gap:7px;padding:2px 4px;border-radius:4px}
  .row:hover{background:var(--card)}
  .tw{border:none;background:none;width:16px;color:var(--dim);font-size:9px;cursor:pointer;flex:none}
  .tw.leaf{color:var(--rule);cursor:default}
  .lbl{font-family:var(--mono);font-size:13px}
  .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .cnt{font-family:var(--mono);font-size:11px;color:var(--dim)}
  #app{display:none}
  #gate{position:fixed;inset:0;background:#1B4A63;display:grid;place-items:center;padding:20px}
  #gate .box{background:#fff;border-radius:8px;padding:24px;width:min(340px,100%);text-align:center}
  #gate input{width:100%;padding:10px;border:1px solid #ccc;border-radius:5px;margin:12px 0;font-size:14px}
  #gate button{width:100%;padding:10px;border:none;border-radius:5px;background:#1B4A63;color:#fff;cursor:pointer}
  #gate .err{color:#dc2626;font-size:12px;height:14px;margin-top:6px}
</style>

<div id="gate"><div class="box">
  <b>Testing pipeline</b>
  <input id="pw" type="password" placeholder="access word" autofocus autocomplete="off">
  <button onclick="go()">View</button><div class="err" id="err"></div>
</div></div>

<div id="app">
  <div class="head">
    <h1>Testing pipeline — status</h1>
    <div class="legend">
      <span><i style="background:var(--done)"></i>done</span>
      <span><i style="background:var(--run)"></i>running</span>
      <span><i style="background:var(--queue)"></i>queued</span>
      <span id="tally"></span>
    </div>
  </div>
  <div class="wrap">
    <div class="bar"><button onclick="allOpen(1)">Expand</button><button onclick="allOpen(0)">Collapse</button></div>
    <div id="tree"></div>
  </div>
</div>

<script>
const RAIL=["#1B4A63","#2E6E8E","#4B8AA8","#7FB0C4","#A8CAD8","#C6DCE5"];
const SYNTH=["s1 ATT only","s2 +P1–P4","s3 +step","s4 +checklist","s5 +padding","s6 +ATTc","s7 +P1–P4+ATTc","s8 +Role"];
const LEVELS=[
  {name:"Model",   opts:["Qwen 3.6","Qwen 3.8 (27b)","GLM 5.2","GLM 5.3"]},
  {name:"Tokens",  opts:["2k","4k"]},
  {name:"Features",opts:["None","Code","Search","Code+Search"]},
  {name:"Synthesis",opts:SYNTH},
  {name:"Dialogue",opts:["S5 × D/I","S7 × D/I"]},
];
// status rule: GLM 5.2 synthesis (no tools) = done (smoke); GLM 5.2 dialogue = running; else queued.
function statusOf(path){                       // path = labels root→node
  if(path[0]!=="GLM 5.2") return "queued";
  const last=path[path.length-1];
  if(SYNTH.includes(last)) return "done";
  if(last==="S5 × D/I"||last==="S7 × D/I") return "running";
  return null;                                 // internal GLM node — colour rolls up from kids
}
function build(lvls){
  const make=(label,depth,path)=>{
    const p=path.concat(label===null?[]:[label]);
    const node={label,depth,path:p,open:depth<1,kids:[]};
    if(depth<lvls.length) node.kids=lvls[depth].opts.map(o=>make(o,depth+1,p));
    node.status=statusOf(p);
    return node;
  };
  const r=make("All runs",0,[]); r.open=true; return r;
}
function roll(n){ // rollup: internal node status = running if any kid running, else done if all done, else queued
  if(!n.kids.length) return n.status||"queued";
  const s=n.kids.map(roll);
  n.status = s.includes("running")?"running": s.every(x=>x==="done")?"done":"queued";
  return n.status;
}
let root=build(LEVELS); roll(root);
function el(n){
  const w=document.createElement("div"); w.className="node";
  const row=document.createElement("div"); row.className="row";
  const tw=document.createElement("button"); tw.className="tw"+(n.kids.length?"":" leaf");
  tw.textContent=n.kids.length?(n.open?"▼":"▶"):"·";
  if(n.kids.length) tw.onclick=()=>{n.open=!n.open;draw();};
  row.appendChild(tw);
  const dot=document.createElement("span"); dot.className="dot";
  dot.style.background=n.status==="done"?"var(--done)":n.status==="running"?"var(--run)":"var(--queue)";
  row.appendChild(dot);
  const lbl=document.createElement("span"); lbl.className="lbl"; lbl.textContent=n.label;
  lbl.style.color=RAIL[Math.min(n.depth,RAIL.length-1)]; row.appendChild(lbl);
  if(n.kids.length){const c=document.createElement("span");c.className="cnt";c.textContent=leaves(n);row.appendChild(c);}
  w.appendChild(row);
  if(n.kids.length&&n.open){const k=document.createElement("div");k.className="kids";
    k.style.borderLeftColor=RAIL[Math.min(n.depth,RAIL.length-1)]+"55";
    n.kids.forEach(c=>k.appendChild(el(c)));w.appendChild(k);}
  return w;
}
function leaves(n){return n.kids.length?n.kids.reduce((a,c)=>a+leaves(c),0):1;}
function walk(n,f){f(n);n.kids.forEach(c=>walk(c,f));}
function allOpen(v){walk(root,n=>n.open=!!v);root.open=true;draw();}
function draw(){const t=document.getElementById("tree");t.innerHTML="";t.appendChild(el(root));
  let d=0,r=0,q=0;walk(root,n=>{if(!n.kids.length){n.status==="done"?d++:n.status==="running"?r++:q++;}});
  document.getElementById("tally").textContent=`${d} done · ${r} running · ${q} queued · ${d+r+q} total`;}

const ACCESS_WORD="anton-bat-2026";
function go(){if(document.getElementById("pw").value.trim()===ACCESS_WORD){sessionStorage.setItem("cav_ok","1");
  document.getElementById("gate").style.display="none";document.getElementById("app").style.display="block";draw();}
  else document.getElementById("err").textContent="Wrong access word.";}
document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")go();});
if(sessionStorage.getItem("cav_ok")==="1"){document.getElementById("gate").style.display="none";document.getElementById("app").style.display="block";draw();}
</script>
