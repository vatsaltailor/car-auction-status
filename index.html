<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Run Status</title>
<style>
  body{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;max-width:880px;margin:0 auto;padding:20px;color:#1a1a1a;font-size:15px;line-height:1.5}
  h1{font-size:22px;margin:0 0 2px}
  .sub{color:#666;font-size:13px;margin-bottom:18px}
  h2{font-size:16px;margin:26px 0 8px;padding-bottom:4px;border-bottom:2px solid #eee}
  table{border-collapse:collapse;width:100%;font-size:14px;margin:4px 0}
  th{text-align:left;color:#666;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em;padding:6px 8px;border-bottom:1px solid #ddd}
  td{padding:7px 8px;border-bottom:1px solid #f0f0f0;vertical-align:top}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
  .running .dot{background:#2563eb}.done .dot{background:#16a34a}.queued .dot{background:#9ca3af}
  .st{font-size:12px;color:#666}
  .sum{color:#444;font-size:14px;margin:10px 0 4px}
  .sum b{color:#111}
  #app{display:none}
  /* gate */
  #gate{position:fixed;inset:0;background:#1f2937;display:grid;place-items:center;padding:20px}
  #gate .box{background:#fff;border-radius:8px;padding:26px;width:min(360px,100%);text-align:center}
  #gate input{width:100%;padding:10px;border:1px solid #ccc;border-radius:5px;font-size:14px;margin:12px 0}
  #gate button{width:100%;padding:10px;border:none;border-radius:5px;background:#1f2937;color:#fff;font-size:14px;cursor:pointer}
  #gate .err{color:#dc2626;font-size:12px;height:14px;margin-top:6px}
</style>

<div id="gate"><div class="box">
  <b>Car Auction — Run Status</b>
  <input id="pw" type="password" placeholder="access word" autofocus autocomplete="off">
  <button onclick="go()">View</button>
  <div class="err" id="err"></div>
</div></div>

<div id="app">
  <h1>Car Auction Valuation — Run Status</h1>
  <div class="sub">updated 2026-08-20 · <span id="counts"></span></div>
  <div id="board"></div>
  <p class="st" style="margin-top:30px;color:#999">Private status page. To update: edit the RUNS list in index.html and redeploy.</p>
</div>

<script>
// ============ edit this list to update the board ============
const RUNS = [
  // status: "running" | "done" | "queued"
  {status:"queued",  name:"GLM-5.2 synthesis at scale", model:"GLM-5.2 (Lumen)", scope:"8 cells · k=3 · N cars", result:"adapter ready; smoke passed 8/8"},
  {status:"queued",  name:"GLM-5.2 D/I dialogue adapter", model:"GLM-5.2 (Lumen)", scope:"multi-turn + tools", result:"tool-calling confirmed; building"},
  {status:"queued",  name:"Full-dataset synthesis via llmflux", model:"open models", scope:"Campus Cluster batch", result:"free on sridhar-ic; planned"},
  {status:"queued",  name:"More cars to firm up dialogue result", model:"Opus 4.8 + GPT-5.5", scope:"beyond 10 cars", result:"planned (small-n)"},

  {status:"done", name:"Signals P1 / P2 / P3", model:"—", scope:"eval-200", result:"P3 MoE best: RMSE $8.9k / MAPE 20.6%"},
  {status:"done", name:"Synthesis ablation S1–S8", model:"Opus 4.8 + compiler", scope:"50 cars · k=3", result:"s7 best RMSE ~$5.6k / 22.8%"},
  {status:"done", name:"D/I dialogues (v7, DB operator)", model:"Opus 4.8 + GPT-5.5", scope:"10 cars · 4 cond.", result:"D·withDB 13.7% best; dialogue ≈ neutral"},
  {status:"done", name:"D-only, no-DB operator (v8)", model:"Opus 4.8 + GPT-5.5", scope:"10 cars · 2 cond.", result:"D·noDB 15.4% — did not improve"},
  {status:"done", name:"GLM-5.2 synthesis smoke", model:"GLM-5.2 (Lumen)", scope:"1 car · 8 cells", result:"8/8 parse · ~0.069 coins/car"},
];
// ============================================================

const GROUPS = [["running","Running"],["done","Done"],["queued","Queued / next"]];
function render(){
  const board = document.getElementById("board");
  board.innerHTML = "";
  for(const [key,label] of GROUPS){
    const rows = RUNS.filter(r => r.status === key);
    if(!rows.length) continue;
    const h = document.createElement("h2"); h.textContent = label + " (" + rows.length + ")";
    board.appendChild(h);
    const t = document.createElement("table");
    t.innerHTML = "<tr><th>Run</th><th>Model</th><th>Scope</th><th>Result / note</th></tr>";
    for(const r of rows){
      const tr = document.createElement("tr"); tr.className = key;
      tr.innerHTML = `<td><span class="dot"></span>${esc(r.name)}</td><td class="st">${esc(r.model)}</td><td class="st">${esc(r.scope)}</td><td>${esc(r.result)}</td>`;
      t.appendChild(tr);
    }
    board.appendChild(t);
  }
  const n = s => RUNS.filter(r=>r.status===s).length;
  document.getElementById("counts").innerHTML = `<b>${n("done")}</b> done · <b>${n("running")}</b> running · <b>${n("queued")}</b> queued`;
}
function esc(s){ return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

// plain client-side gate (soft)
const ACCESS_WORD = "anton-bat-2026";
function go(){
  if(document.getElementById("pw").value.trim() === ACCESS_WORD){
    sessionStorage.setItem("cav_ok","1");
    document.getElementById("gate").style.display="none";
    document.getElementById("app").style.display="block";
    render();
  } else document.getElementById("err").textContent = "Wrong access word.";
}
document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")go();});
if(sessionStorage.getItem("cav_ok")==="1"){ document.getElementById("gate").style.display="none"; document.getElementById("app").style.display="block"; render(); }
</script>
